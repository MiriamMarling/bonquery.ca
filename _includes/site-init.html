<script>
// ── Mobile language toggle ────────────────────────────────────────────────
// Uses location.pathname so the correct label appears regardless of whether
// Quarto renders the navbar id attribute (it does not).
(function () {
  var darkTog = document.querySelector(".quarto-color-scheme-toggle");
  if (!darkTog) return;
  var isFR  = location.pathname.startsWith("/fr/") || location.pathname === "/fr";
  var clone = document.createElement("a");
  clone.className = "bq-lang-mobile";
  clone.href      = isFR ? "/" : "/fr/";
  clone.textContent = isFR ? "EN" : "FR";
  darkTog.parentNode.insertBefore(clone, darkTog.nextSibling);
})();

// ── Nav cleanup ───────────────────────────────────────────────────────────
// The Quarto FR profile render re-renders all pages with a merged navbar
// (EN items + FR items concatenated). This script removes the wrong-language
// items at runtime on every page load.
(function () {
  var isFR = location.pathname.startsWith("/fr/") || location.pathname === "/fr";

  // Left nav: keep items whose links match the current language.
  // Each top-level <li> contains only same-language hrefs, so checking for
  // "fr/" is a reliable discriminator.
  var leftNav = document.querySelector(".navbar-nav.me-auto");
  if (leftNav) {
    Array.from(leftNav.querySelectorAll(":scope > li")).forEach(function (li) {
      var links = Array.from(li.querySelectorAll("a[href]"));
      var hasFRLink = links.some(function (a) {
        return (a.getAttribute("href") || "").indexOf("fr/") !== -1;
      });
      if (isFR ? !hasFRLink : hasFRLink) li.remove();
    });
  }

  // Right nav: remove the self-referential language-toggle link that merges
  // in from the other profile (the EN config's "FR" link rides along with
  // the FR config's "EN" link, and vice versa).
  var rightNav = document.querySelector(".navbar-nav.ms-auto");
  if (rightNav) {
    Array.from(rightNav.querySelectorAll("li")).forEach(function (li) {
      var a = li.querySelector("a[href]");
      var hasFRLink = a && (a.getAttribute("href") || "").indexOf("fr/") !== -1;
      if (isFR) {
        if (hasFRLink) li.remove();
      } else {
        if (!hasFRLink) li.remove();
      }
    });
  }
})();

// ── Theme toggle label ("Light" / "Dark") ────────────────────────────────
(function () {
  var tog = document.querySelector(".quarto-color-scheme-toggle");
  if (!tog) return;
  var isFR = location.pathname.startsWith("/fr/") || location.pathname === "/fr";
  var label = document.createElement("span");
  label.className = "bq-theme-label";
  var update = function () {
    var isDark = document.body.classList.contains("quarto-dark");
    label.textContent = isFR
      ? (isDark ? "Clair" : "Sombre")
      : (isDark ? "Light" : "Dark");
  };
  tog.appendChild(label);
  update();
  new MutationObserver(update).observe(
    document.body, { attributes: true, attributeFilter: ["class"] }
  );
})();

// Live dashboard-card previews. This runs only on pages that contain the
// shared dashboard cards and uses the same generated file as the dashboards.
(function () {
  var isFR = location.pathname.startsWith("/fr/") || location.pathname === "/fr";
  var locale = isFR ? "fr-CA" : "en-CA";
  var copy = isFR ? {
    unavailable: "Aperçu indisponible. Ouvrez le tableau de bord.",
    offlineBeds: "lits financés du secteur des personnes seules indisponibles",
    acrossPrograms: " personnes recensées dans l'ensemble des programmes de refuge",
    activelyHomeless: "personnes en situation d'itinérance active",
    newlyIdentified: "Nouvellement identifiées",
    movedToHousing: "Ont obtenu un logement",
    januaryTo: "De janvier à ",
    latest: "Plus récent : ",
    trend: "Tendance de l'itinérance active jusqu'à "
  } : {
    unavailable: "Preview unavailable. Open the dashboard.",
    offlineBeds: "funded shelter beds for single adults were unavailable",
    acrossPrograms: " people staying in shelter programs",
    activelyHomeless: "people counted as homeless",
    newlyIdentified: "Newly counted as homeless",
    movedToHousing: "Moved into housing",
    januaryTo: "January to ",
    latest: "Latest: ",
    trend: "People counted as homeless through "
  };
  var dailyMount = document.getElementById("bq-preview-daily");
  var monthlyMount = document.getElementById("bq-preview-monthly");
  var ytdMount = document.getElementById("bq-preview-ytd");
  var historyMount = document.getElementById("bq-preview-history");
  if (!dailyMount && !monthlyMount && !ytdMount && !historyMount) return;

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function metricRow(label, value) {
    var row = make("div");
    row.append(make("span", "", label), make("strong", "", value));
    return row;
  }

  function meter(value, maximum, good) {
    var track = make("i");
    var bar = make("b", good ? "bq-preview-bar-good" : "");
    bar.style.width = ((value / maximum) * 100) + "%";
    track.append(bar);
    return track;
  }

  function showUnavailable(mount) {
    if (!mount) return;
    mount.replaceChildren(make("span", "", copy.unavailable));
  }

  fetch("/data/daily_occupancy.json", {cache: "no-cache"})
    .then(function (response) {
      if (!response.ok) throw new Error("Daily preview data unavailable");
      return response.json();
    })
    .then(function (data) {
      if (!dailyMount || !data.length) return;
      var latestDate = data.reduce(function (latest, row) {
        return row.date > latest ? row.date : latest;
      }, "");
      var rows = data.filter(function (row) { return row.date === latestDate; });
      var singles = rows.find(function (row) { return row.key === "singles_total"; });
      var system = rows.find(function (row) { return row.key === "all_shelter"; });
      if (!singles || !system) throw new Error("Daily preview rows unavailable");
      var dateParts = latestDate.split("-").map(Number);
      var dateLabel = new Date(dateParts[0], dateParts[1] - 1, dateParts[2])
        .toLocaleDateString(locale, {year: "numeric", month: "long", day: "numeric"});
      var offline = Math.max((+singles.cap_funding || 0) - (+singles.cap || 0), 0);
      var daily = make("div", "bq-preview-kpi bq-preview-daily");
      daily.append(
        make("strong", "", Number(offline).toLocaleString(locale)),
        make("span", "", copy.offlineBeds + " · " + dateLabel),
        make("small", "", Number(system.ind).toLocaleString(locale) + copy.acrossPrograms)
      );
      dailyMount.replaceChildren(daily);
    })
    .catch(function () { showUnavailable(dailyMount); });

  fetch("/data/shelter_flow.json", {cache: "no-cache"})
    .then(function (response) {
      if (!response.ok) throw new Error("Dashboard preview data unavailable");
      return response.json();
    })
    .then(function (data) {
      var rows = data
        .filter(function (row) { return row.population_group === "All Population"; })
        .slice()
        .sort(function (a, b) { return a.flow_date.localeCompare(b.flow_date); });
      if (!rows.length) throw new Error("Dashboard preview data empty");

      var latest = rows[rows.length - 1];
      var dateParts = latest.flow_date.split("-").map(Number);
      var latestYear = dateParts[0];
      var latestMonth = dateParts[1];
      var latestLabel = new Date(latestYear, latestMonth - 1, 1)
        .toLocaleDateString(locale, {month: "long", year: "numeric"});
      var fmt = function (value) {
        return Number(value).toLocaleString(locale);
      };

      if (monthlyMount) {
        var kpi = make("div", "bq-preview-kpi");
        kpi.append(
          make("strong", "", fmt(latest.actively_homeless)),
          make("span", "", copy.activelyHomeless + " · " + latestLabel)
        );
        monthlyMount.replaceChildren(kpi);
      }

      var ytdRows = rows.filter(function (row) {
        var parts = row.flow_date.split("-").map(Number);
        return parts[0] === latestYear && parts[1] <= latestMonth;
      });
      var ytdNew = ytdRows.reduce(function (sum, row) {
        return sum + (+row.newly_identified || 0);
      }, 0);
      var ytdHoused = ytdRows.reduce(function (sum, row) {
        return sum + (+row.moved_to_housing || 0);
      }, 0);
      var ytdMax = Math.max(ytdNew, ytdHoused, 1);

      if (ytdMount) {
        var bars = make("div", "bq-preview-bars");
        bars.append(
          metricRow(copy.newlyIdentified, fmt(ytdNew)),
          meter(ytdNew, ytdMax, false),
          metricRow(copy.movedToHousing, fmt(ytdHoused)),
          meter(ytdHoused, ytdMax, true),
          make("small", "", copy.januaryTo + latestLabel)
        );
        ytdMount.replaceChildren(bars);
      }

      if (historyMount) {
        var trend = rows.slice(-48).map(function (row) {
          return +row.actively_homeless;
        });
        var minimum = Math.min.apply(null, trend);
        var maximum = Math.max.apply(null, trend);
        var spread = Math.max(maximum - minimum, 1);
        var wrap = make("div", "bq-preview-history-wrap");
        var spark = make("div", "bq-preview-spark");
        spark.setAttribute("role", "img");
        spark.setAttribute(
          "aria-label",
          copy.trend + latestLabel +
            (isFR ? "; valeur la plus récente " : "; latest value ") +
            fmt(latest.actively_homeless)
        );
        trend.forEach(function (value, index) {
          var bar = make("span", index === trend.length - 1 ? "is-latest" : "");
          bar.style.height = (20 + ((value - minimum) / spread) * 80) + "%";
          spark.append(bar);
        });
        wrap.append(spark, make("small", "", copy.latest + fmt(latest.actively_homeless)));
        historyMount.replaceChildren(wrap);
      }
    })
    .catch(function () {
      showUnavailable(monthlyMount);
      showUnavailable(ytdMount);
      showUnavailable(historyMount);
    });
})();

// ── Language toggle link + hreflang injection ─────────────────────────────
// Computes the exact mirror URL from the current pathname and updates the
// navbar toggle link, then injects hreflang <link> tags for search engines.
(function () {
  var frPfx = "/fr/";
  var path  = location.pathname;
  var isFR  = path.startsWith(frPfx) || path === "/fr";

  var enPath, frPath;
  if (isFR) {
    enPath = (path === "/fr" || path === "/fr/")
      ? "/"
      : path.replace(frPfx, "/");
    frPath = (path === "/fr") ? "/fr/" : path;
  } else {
    enPath = path;
    frPath = frPfx + path.replace(/^\//, "");
  }

  function abs(p) { return location.origin + p; }

  // Update the navbar toggle link. After nav cleanup the right nav has
  // exactly one <a>: the link to the other language.
  var rightNav = document.querySelector(".navbar-nav.ms-auto");
  if (rightNav) {
    var tog = rightNav.querySelector("a.nav-link");
    if (tog) {
      tog.href        = isFR ? abs(enPath) : abs(frPath);
      tog.textContent = isFR ? "EN" : "FR";
    }
  }

  // Also sync the mobile clone's href to the specific counterpart page.
  var mobileClone = document.querySelector(".bq-lang-mobile");
  if (mobileClone) {
    mobileClone.href = isFR ? abs(enPath) : abs(frPath);
  }

  // Hreflang <link> tags for search engines.
  function addLink(rel, hreflang, href) {
    var el = document.createElement("link");
    el.rel = rel;
    if (hreflang) el.setAttribute("hreflang", hreflang);
    el.href = href;
    document.head.appendChild(el);
  }
  addLink("alternate", "en-CA",    abs(enPath));
  addLink("alternate", "fr-CA",    abs(frPath));
  addLink("alternate", "x-default", abs(enPath));
})();
</script>
