project:
  type: website
  output-dir: _site   # built HTML goes here — not committed to main
  render:
    - index.qmd
    - about.qmd
    - projects/about-the-data.qmd
    - projects/central-intake.qmd
    - projects/cold-response.qmd
    - projects/daily-occupancy.qmd
    - projects/data-validation.qmd
    - projects/data-validation-central-intake.qmd
    - projects/historical-trends.qmd
    - projects/monthly-snapshot.qmd
    - projects/toronto-shelter.qmd
    - projects/ytd-comparison.qmd
  resources:
    - data/daily_occupancy.json                   # live daily-card preview
    - data/daily_occupancy.csv                    # not FileAttachment-referenced
    - data/shelter_flow.json                      # homepage dashboard previews
    - data/central_intake.json                    # homepage caller-card preview
    - data/season_rug.csv                         # cold-response: temperature rug
    - data/cold_response_binned_by_winter_sc.csv  # cold-response: observed means

website:
  title: "BonQuery"
  description: "BonQuery rebuilds Toronto shelter dashboards and checks public data for people who need somewhere safe to stay, including people who are housing insecure, unhoused, or experiencing homelessness."
  site-url: https://bonquery.ca
  image: images/bonquery-social-card.png
  image-alt: "BonQuery: Toronto Shelter Data Updated Daily"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects/toronto-shelter.qmd
        text: Dashboards
      - href: projects/cold-response.qmd
        text: "Left in the Cold"
      - text: "Data & Methods"
        menu:
          - href: projects/about-the-data.qmd
            text: "About the Data"
          - href: projects/data-validation.qmd
            text: "Daily Data Sources"
          - href: projects/data-validation-central-intake.qmd
            text: "Central Intake Validation"
      - href: about.qmd
        text: About
    right:
      - text: "FR"
        href: /fr/
        id: bq-lang-toggle-nav
  page-footer:
    center: |
      Independent public-interest analysis of Toronto's shelter system.
      <br>
      <span style="font-size: 0.85em; opacity: 0.7;">© 2026 Miriam Marling · BonQuery</span>
  bread-crumbs: true
  back-to-top-navigation: true

format:
  html:
    lang: en-CA
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-location: right
    canonical-url: true
    include-after-body:
      - _includes/site-init.html
      - _includes/toronto-help-contacts.qmd
